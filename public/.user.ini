; Registration uploads: an ID photo or business permit up to 10MB, which the
; validation rules in the registration controllers enforce. PHP's stock limits
; are 2M/8M, so a phone photo is discarded before Laravel sees it and the form
; reports a failed upload. This file is read by PHP-FPM and CGI; servers that
; use mod_php get the same values from public/.htaccess, and nginx needs them in
; the php.ini or the FPM pool instead.
upload_max_filesize = 12M
post_max_size = 16M
max_file_uploads = 20
